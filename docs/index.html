<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>De Drievoet · Paartjes</title><style>
    :root{color-scheme:light;--ink:#2f201b;--accent:#a23e2a;--paper:#fffaf6;--line:#e7d7ce}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.55 system-ui,sans-serif}main{max-width:980px;margin:auto;padding:32px 22px 70px}h1,h2{line-height:1.15}a{color:var(--accent)}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.links{display:flex;flex-wrap:wrap;gap:10px}.links a{padding:8px 12px;border:1px solid var(--accent);border-radius:999px;text-decoration:none}.muted{color:#765f55}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;font:inherit}</style></head><body><main><h1>De Drievoet · Paartjes</h1><p class="muted">Openbare index van goedgekeurde Drievoet-publicaties.</p><input id="q" type="search" placeholder="Zoek nummer of woord"><section id="items"></section><script>const q=document.querySelector("#q");q.addEventListener("input",()=>{const s=q.value.toLowerCase();document.querySelectorAll(".card").forEach(x=>x.hidden=!x.dataset.search.includes(s))});</script></main></body></html>
